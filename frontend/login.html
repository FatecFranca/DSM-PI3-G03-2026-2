<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Apoio-login</title>
        <link rel="stylesheet" href="/frontend/styles/style.css">
</head>
<body>

  
        <div id="menu"><a href="login.html">Login</a> <a href="#">Contato</a>
         <a href="#">Cadastre-se</a> <a href="#">Sobre</a> </div>
         

  

  <main class="card">
    <h2>Seja Bem vindo</h2>

    <form id="formLogin">
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" placeholder="Digite sua senha" required>
      </div>

      <button type="submit">Entrar</button>

      <p id="mensagem"></p>
    </form>

    <div class="links">
      <a href="#">Esqueci minha senha</a><br>
      Não tem conta? <a href="cadastro.html">Cadastre-se</a>
    </div>
  </main>

  <script>
    const form = document.getElementById("formLogin");
    const mensagem = document.getElementById("mensagem");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      if (senha.length < 6) {
        mensagem.textContent = "A senha deve ter pelo menos 6 caracteres.";
        return;
      }

      mensagem.textContent = "";

      // Aqui você conecta com o seu backend, por exemplo:
      // fetch("http://localhost:3000/login", {
      //   method: "POST",
      //   headers: { "Content-Type": "application/json" },
      //   body: JSON.stringify({ email, senha })
      // })
      //   .then(res => res.json())
      //   .then(data => { window.location.href = "index.html"; })
      //   .catch(() => { mensagem.textContent = "Erro ao fazer login."; });

      console.log("Login enviado:", email);
    });
  </script>

</body>
</html>
