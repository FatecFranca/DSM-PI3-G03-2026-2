<!DOCTYPE html>
<html lang="pt-BR">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Apoio - Avaliar serviço</title>
        <link rel="shortcut icon" href="images/favicon.jpg" type="image/jpeg">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
        <header>
                <nav id="menu">
                        <a href="index.html">Início</a>
                        <a href="solicitacoes.html">Minhas solicitações</a>
                        <a href="orcamentos.html">Orçamentos</a>
                        <a href="#contato">Contato</a>
                </nav>
        </header>

               <main>
                <section class="secao">
                        <div class="caixa cabecalho-pagina">
                                <h2>Avaliar serviço</h2>
                                <p class="subtitulo">Sua avaliação ajuda outros clientes a escolher bons profissionais.</p>
                        </div>

                        <section class="card">
                                <form id="formAvaliacao">
                                        <div class="campo">
                                                <label>Qual nota você dá para o serviço?</label>

                                                <div class="estrelas">
                                                        <input type="radio" id="nota5" name="nota" value="5" required>
                                                        <label for="nota5" title="5 - Excelente"><i class="fa-solid fa-star"></i></label>

                                                        <input type="radio" id="nota4" name="nota" value="4">
                                                        <label for="nota4" title="4 - Muito bom"><i class="fa-solid fa-star"></i></label>

                                                        <input type="radio" id="nota3" name="nota" value="3">
                                                        <label for="nota3" title="3 - Bom"><i class="fa-solid fa-star"></i></label>

                                                        <input type="radio" id="nota2" name="nota" value="2">
                                                        <label for="nota2" title="2 - Ruim"><i class="fa-solid fa-star"></i></label>

                                                        <input type="radio" id="nota1" name="nota" value="1">
                                                        <label for="nota1" title="1 - Péssimo"><i class="fa-solid fa-star"></i></label>
                                                </div>
                                        </div>

                                        <div class="campo">
                                                <label for="comentario">Comentário (opcional)</label>
                                                <textarea id="comentario" rows="4"
                                                        placeholder="Ex.: Chegou no horário e resolveu rápido."></textarea>
                                        </div>

                                        <button type="submit">Enviar avaliação</button>
                                        <p id="mensagem"></p>
                                </form>
                        </section>
                </section>
        </main>

        <footer id="contato">
                <p>&copy; 2026 Apoio - Projeto Interdisciplinar III - Fatec Franca</p>
        </footer>

        <script src="js/avaliacao.js"></script>
</body>

</html>
