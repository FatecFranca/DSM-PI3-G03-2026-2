<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoio - Cadastro de prestador</title>
    <link rel="shortcut icon" href="images/favicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header>
        <nav id="menu">
            <a href="index.html">Início</a>
            <a href="login.html">Login</a>
            <a href="index.html#apresentacao">Sobre</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <main>
        <section class="card">
            <h2>Cadastro de prestador</h2>

            <form id="formCadastro">
                <fieldset>
                    <legend>Dados pessoais</legend>

                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" autocomplete="name" required>
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" maxlength="14" inputmode="numeric"
                            pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Digite os 11 números do CPF"
                            placeholder="000.000.000-00" required>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" maxlength="15" autocomplete="tel" placeholder="(16) 99999-9999"
                            required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" autocomplete="email" placeholder="seu@email.com" required>
                    </div>
                                        <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" minlength="6" autocomplete="new-password"
                            placeholder="Mínimo de 6 caracteres" required>
                    </div>

                    <div class="campo">
                        <label for="confirmarSenha">Repita a senha</label>
                        <input type="password" id="confirmarSenha" minlength="6" autocomplete="new-password"
                            placeholder="Digite a senha de novo" required>
                    </div>
                </fieldset>


                <fieldset>
                    <legend>Endereço</legend>

                    <div class="campo">
                        <label for="logradouro">Rua / Avenida</label>
                        <input type="text" id="logradouro" autocomplete="address-line1" required>
                    </div>

                    <div class="campo">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" placeholder="Ex.: 120" required>
                    </div>

                    <div class="campo">
                        <label for="municipio">Cidade</label>
                        <input type="text" id="municipio" autocomplete="address-level2" required>
                    </div>

                    <div class="campo">
                        <label for="uf">UF</label>
                        <input type="text" id="uf" maxlength="2" pattern="[A-Za-z]{2}"
                            title="Digite a sigla do estado, ex.: SP" placeholder="SP" required>
                    </div>

                    <div class="campo">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" maxlength="8" inputmode="numeric" pattern="[0-9]{8}"
                            title="Digite os 8 números do CEP, sem traço" autocomplete="postal-code"
                            placeholder="Somente números" required>
                    </div>
                </fieldset>
                <fieldset id="grupoEspecialidades">
                    <legend>Especialidades</legend>
                    <label><input type="checkbox" name="especialidade" value="Eletricista"> Eletricista</label>
                    <label><input type="checkbox" name="especialidade" value="Encanador"> Encanador</label>
                    <label><input type="checkbox" name="especialidade" value="Pedreiro"> Pedreiro</label>
                    <label><input type="checkbox" name="especialidade" value="Pintor"> Pintor</label>
                </fieldset>

                <button type="submit">Cadastrar</button>
                <p id="mensagem"></p>
            </form>

            <div class="links">
                Já tem conta? <a href="login.html">Entrar</a>
            </div>
        </section>
    </main>

    <footer id="contato">
        <p>&copy; 2026 Apoio - Projeto Interdisciplinar III - Fatec Franca</p>
    </footer>

    <script src="js/mascaras.js"></script>
    <script src="js/cadastro-prestador.js"></script>
</body>

</html>
