<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apoio - Crie sua conta</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header>
        <nav id="menu">
            <a href="index.html">Início</a>
            <a href="login.html">Login</a>
            <a href="cadastro.html">Cadastre-se</a>
        </nav>
    </header>

    <main>
        <section class="card">
            <h2>Crie sua conta</h2>

            <form id="formCadastro">
                
                <div class="campo">
                    <span>Eu sou:</span>
                    <label><input type="radio" name="tipo" value="cliente" checked> Cliente</label>
                    <label><input type="radio" name="tipo" value="prestador"> Prestador de serviço</label>
                </div>

                
                <fieldset>
                    <legend>Dados pessoais</legend>

                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" autocomplete="name" required>
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" maxlength="11" inputmode="numeric"
                               pattern="[0-9]{11}" title="Digite os 11 números do CPF, sem pontos e traço"
                               placeholder="Somente números" required>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" maxlength="11" autocomplete="tel"
                               placeholder="DDD + número" required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" autocomplete="email"
                               placeholder="seu@email.com" required>
                    </div>
                </fieldset>

                
                <fieldset>
                    <legend>Endereço</legend>

                    <div class="campo">
                        <label for="logradouro">Rua / Avenida</label>
                        <input type="text" id="logradouro" autocomplete="address-line1" required>
                    </div>

                    <div class="campo">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" placeholder="Ex.: 120" required>
                    </div>

                    <div class="campo">
                        <label for="municipio">Cidade</label>
                        <input type="text" id="municipio" autocomplete="address-level2" required>
                    </div>

                    <div class="campo">
                        <label for="uf">UF</label>
                        <input type="text" id="uf" maxlength="2" pattern="[A-Za-z]{2}"
                               title="Digite a sigla do estado, ex.: SP" placeholder="SP" required>
                    </div>

                    <div class="campo">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" maxlength="8" inputmode="numeric"
                               pattern="[0-9]{8}" title="Digite os 8 números do CEP, sem traço"
                               autocomplete="postal-code" placeholder="Somente números" required>
                    </div>
                </fieldset>

                <!-- 4. Especialidades (só para prestador) -->
                <fieldset id="grupoEspecialidades">
                    <legend>Especialidades</legend>
                    <label><input type="checkbox" name="especialidade" value="Eletricista"> Eletricista</label>
                    <label><input type="checkbox" name="especialidade" value="Encanador"> Encanador</label>
                    <label><input type="checkbox" name="especialidade" value="Pedreiro"> Pedreiro</label>
                    <label><input type="checkbox" name="especialidade" value="Pintor"> Pintor</label>
                </fieldset>

                <button type="submit">Cadastrar</button>
                <p id="mensagem"></p>
            </form>

            <div class="links">
                Já tem conta? <a href="login.html">Entrar</a>
            </div>
        </section>
    </main>

    <footer id="contato">
        <p>&copy; 2026 Apoio - Projeto Interdisciplinar III - Fatec Franca</p>
    </footer>

    <script src="js/cadastro.js"></script>
</body>

</html>
